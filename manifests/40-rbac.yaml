# Account for the operator itself.
# permissions.
apiVersion: v1
kind: ServiceAccount
metadata:
  annotations:
    capability.openshift.io/name: NodeTuning
    include.release.openshift.io/hypershift: "true"
    include.release.openshift.io/ibm-cloud-managed: "true"
    include.release.openshift.io/self-managed-high-availability: "true"
    include.release.openshift.io/single-node-developer: "true"
  name: cluster-node-tuning-operator
  namespace: openshift-cluster-node-tuning-operator

---

# Cluster role for the operator itself.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  annotations:
    capability.openshift.io/name: NodeTuning
    include.release.openshift.io/hypershift: "true"
    include.release.openshift.io/ibm-cloud-managed: "true"
    include.release.openshift.io/self-managed-high-availability: "true"
    include.release.openshift.io/single-node-developer: "true"
  name: cluster-node-tuning-operator
rules:
# We own (the right to perform anything with) tuned.openshift.io
- apiGroups: ["tuned.openshift.io"]
  resources: ["tuneds"]
  verbs: ["create","get","delete","list","update","watch","patch"]
- apiGroups: ["tuned.openshift.io"]
  resources: ["tuneds/finalizers","tuneds/status"]
  verbs: ["update"]
- apiGroups: ["tuned.openshift.io"]
  resources: ["profiles"]
  verbs: ["create","get","delete","list","update","watch","patch"]
- apiGroups: ["tuned.openshift.io"]
  resources: ["profiles/finalizers"]
  verbs: ["update"]
# The operator oversees tuned daemonset, which is only ever managed in the
# operator's own namespace (see the namespaced Role below).
- apiGroups: ["security.openshift.io"]
  resources: ["securitycontextconstraints"]
# The operator pod runs with the restricted-v3 SCC (see 50-operator*.yaml);
# the tuned daemonset pods use "privileged" via the "tuned" ServiceAccount.
  resourceNames: ["restricted-v3"]
  verbs: ["use"]
# The pod-matching functionality will likely be deprecated in the
# future.  When it is, remove "pods" below.
- apiGroups: [""]
  resources: ["nodes","pods"]
  verbs: ["get","list","watch"]
# Necessary for the implementation of metrics.
- apiGroups: [""]
  resources: ["nodes/metrics","nodes/specs"]
  verbs: ["get"]
# Needed by every CVO-managed operator.
# infrastructures needed for the leader election code to get infra topology
- apiGroups: ["config.openshift.io"]
  resources: ["clusteroperators", "infrastructures"]
  verbs: ["create","get","list","watch"]
# Needed by every CVO-managed operator.
- apiGroups: ["config.openshift.io"]
  resources: ["clusteroperators/status","clusteroperators/finalizers"]
  verbs: ["update"]
# Needed to support upgrades for SingleNode from 4.12 -> 4.13 for CPUPartitioning
# TODO: Re-evaluate need after 4.13 when SingleNode clusters will be updated to the new CPUPartitioning method.
- apiGroups: ["config.openshift.io"]
  resources: ["infrastructures/status"]
  verbs: ["update"]
# Needed by the core operator functionality.
- apiGroups: ["machineconfiguration.openshift.io"]
  resources: ["kubeletconfigs", "machineconfigs"]
  verbs: ["create","get","delete","list","update","watch"]
# Needed by the core operator functionality.
- apiGroups: ["machineconfiguration.openshift.io"]
  resources: ["machineconfigpools"]
  verbs: ["get","list","watch"]
# Needed by the performance-addon-controller.
# The PAO creates runtime class for each profile that can be used under pods to
# extend CRI-O functionality.
- apiGroups: ["node.k8s.io"]
  resources: ["runtimeclasses"]
  verbs: ["create","get","delete","list","update","watch"]
- apiGroups: ["performance.openshift.io"]
  resources: ["performanceprofiles","performanceprofiles/status","performanceprofiles/finalizers"]
  verbs: ["create","get","delete","list","update","watch","patch"]
# Needed to check the feature gates
- apiGroups: ["config.openshift.io"]
  resources: ["clusterversions", "featuregates"]
  verbs: ["list", "watch"]
# Needed to for the centralized TLS profile
- apiGroups: ["config.openshift.io"]
  resources: ["apiservers"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["replicasets"]
  verbs: ["get"]
---

# Bind the operator cluster role to its Service Account.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  annotations:
    capability.openshift.io/name: NodeTuning
    include.release.openshift.io/hypershift: "true"
    include.release.openshift.io/ibm-cloud-managed: "true"
    include.release.openshift.io/self-managed-high-availability: "true"
    include.release.openshift.io/single-node-developer: "true"
  name: cluster-node-tuning-operator
subjects:
- kind: ServiceAccount
  name: cluster-node-tuning-operator
  namespace: openshift-cluster-node-tuning-operator
roleRef:
  kind: ClusterRole
  name: cluster-node-tuning-operator
userNames:
- "system:serviceaccount:openshift-cluster-node-tuning-operator:cluster-node-tuning-operator"

---

# Namespaced role for the operator itself.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  annotations:
    capability.openshift.io/name: NodeTuning
    include.release.openshift.io/hypershift: "true"
    include.release.openshift.io/ibm-cloud-managed: "true"
    include.release.openshift.io/self-managed-high-availability: "true"
    include.release.openshift.io/single-node-developer: "true"
  name: cluster-node-tuning-operator
  namespace: openshift-cluster-node-tuning-operator
rules:
# No "configmaps" rule here: nothing running with this identity reads or
# writes ConfigMaps in this namespace.  The MachineConfig ConfigMaps are
# managed through the management cluster identity (HyperShift), and the
# metrics client CA bundle lives in kube-system (see the Role below).
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create","get","delete","list","update","watch","patch"]
# We need to be able to "delete" the daemonset when the operator is put into "Removed" state.
- apiGroups: ["apps"]
  resources: ["daemonsets"]
  verbs: ["create","get","delete","list","update","watch"]
# Leader election: the controller-runtime manager locks a Lease in the
# operator namespace.
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["create","get","update"]

---

# Read-only access to the metrics client CA bundle in kube-system
# (see pkg/metrics/server.go).  The operator watches this ConfigMap to pick
# up certificate rotations of the extension API server.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  annotations:
    capability.openshift.io/name: NodeTuning
    include.release.openshift.io/hypershift: "true"
    include.release.openshift.io/ibm-cloud-managed: "true"
    include.release.openshift.io/self-managed-high-availability: "true"
    include.release.openshift.io/single-node-developer: "true"
  name: cluster-node-tuning-operator
  namespace: kube-system
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  resourceNames: ["extension-apiserver-authentication"]
  verbs: ["get","list","watch"]

---

# Bind the kube-system role to the operator Service Account.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  annotations:
    capability.openshift.io/name: NodeTuning
    include.release.openshift.io/hypershift: "true"
    include.release.openshift.io/ibm-cloud-managed: "true"
    include.release.openshift.io/self-managed-high-availability: "true"
    include.release.openshift.io/single-node-developer: "true"
  name: cluster-node-tuning-operator
  namespace: kube-system
subjects:
- kind: ServiceAccount
  name: cluster-node-tuning-operator
  namespace: openshift-cluster-node-tuning-operator
roleRef:
  kind: Role
  name: cluster-node-tuning-operator
  apiGroup: rbac.authorization.k8s.io

---

# Bind the operator namespaced role to its Service Account.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  annotations:
    capability.openshift.io/name: NodeTuning
    include.release.openshift.io/hypershift: "true"
    include.release.openshift.io/ibm-cloud-managed: "true"
    include.release.openshift.io/self-managed-high-availability: "true"
    include.release.openshift.io/single-node-developer: "true"
  name: cluster-node-tuning-operator
  namespace: openshift-cluster-node-tuning-operator
subjects:
- kind: ServiceAccount
  name: cluster-node-tuning-operator
  namespace: openshift-cluster-node-tuning-operator
roleRef:
  kind: Role
  name: cluster-node-tuning-operator
  apiGroup: rbac.authorization.k8s.io

---

# Events for cluster-scoped objects (PerformanceProfiles and other
# cluster-scoped kinds the controllers emit events for) are recorded in the
# "default" namespace by the client-go event recorder, which a Role in the
# operator namespace cannot cover.  Only the minimal create/patch verbs the
# recorder uses are granted (create a new event, patch an existing one to
# bump its count).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  annotations:
    capability.openshift.io/name: NodeTuning
    include.release.openshift.io/hypershift: "true"
    include.release.openshift.io/ibm-cloud-managed: "true"
    include.release.openshift.io/self-managed-high-availability: "true"
    include.release.openshift.io/single-node-developer: "true"
  name: cluster-node-tuning-operator
  namespace: default
rules:
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create","patch"]

---

# Bind the "default" namespace events role to the operator Service Account.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  annotations:
    capability.openshift.io/name: NodeTuning
    include.release.openshift.io/hypershift: "true"
    include.release.openshift.io/ibm-cloud-managed: "true"
    include.release.openshift.io/self-managed-high-availability: "true"
    include.release.openshift.io/single-node-developer: "true"
  name: cluster-node-tuning-operator
  namespace: default
subjects:
- kind: ServiceAccount
  name: cluster-node-tuning-operator
  namespace: openshift-cluster-node-tuning-operator
roleRef:
  kind: Role
  name: cluster-node-tuning-operator
  apiGroup: rbac.authorization.k8s.io

---

# Account for the operand.
apiVersion: v1
kind: ServiceAccount
metadata:
  annotations:
    capability.openshift.io/name: NodeTuning
    include.release.openshift.io/hypershift: "true"
    include.release.openshift.io/ibm-cloud-managed: "true"
    include.release.openshift.io/self-managed-high-availability: "true"
    include.release.openshift.io/single-node-developer: "true"
  name: tuned
  namespace: openshift-cluster-node-tuning-operator

---

# Cluster role for the operand.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  annotations:
    capability.openshift.io/name: NodeTuning
    include.release.openshift.io/hypershift: "true"
    include.release.openshift.io/ibm-cloud-managed: "true"
    include.release.openshift.io/self-managed-high-availability: "true"
    include.release.openshift.io/single-node-developer: "true"
  name: cluster-node-tuning:tuned
rules:
- apiGroups: ["tuned.openshift.io"]
  resources: ["tuneds"]
  verbs: ["get","list","watch"]
- apiGroups: ["tuned.openshift.io"]
  resources: ["profiles"]
  verbs: ["get","list","watch"]
- apiGroups: ["tuned.openshift.io"]
  resources: ["profiles/status"]
  verbs: ["update"]
- apiGroups: ["security.openshift.io"]
  resources: ["securitycontextconstraints"]
  verbs: ["use"]
  resourceNames: ["privileged"]

---

# Bind the operand cluster role to its Service Account.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  annotations:
    capability.openshift.io/name: NodeTuning
    include.release.openshift.io/hypershift: "true"
    include.release.openshift.io/ibm-cloud-managed: "true"
    include.release.openshift.io/self-managed-high-availability: "true"
    include.release.openshift.io/single-node-developer: "true"
  name: cluster-node-tuning:tuned
roleRef:
  kind: ClusterRole
  name: cluster-node-tuning:tuned
subjects:
- kind: ServiceAccount
  name: tuned
  namespace: openshift-cluster-node-tuning-operator
userNames:
- system:serviceaccount:openshift-cluster-node-tuning-operator:tuned
