# NOTE: NetworkPolicy behaviour for hostNetwork pods (tuned) is undefined
# https://kubernetes.io/docs/concepts/services-networking/network-policies/#networkpolicy-and-hostnetwork-pods
# Add rules for tuned pods even though most network plugins are unable to
# distinguish hostNetwork pod traffic from all other traffic.

# The "default" policy for a namespace which denies all ingress and egress traffic.
# This ensures that even pods that aren't selected by any other NetworkPolicy will
# not be allowed ingress or egress traffic.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  annotations:
    capability.openshift.io/name: NodeTuning
    include.release.openshift.io/hypershift: "true"
    include.release.openshift.io/ibm-cloud-managed: "true"
    include.release.openshift.io/self-managed-high-availability: "true"
    include.release.openshift.io/single-node-developer: "true"
  name: default-deny-all
  namespace: openshift-cluster-node-tuning-operator
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress

# Allow access to the API server.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  annotations:
    capability.openshift.io/name: NodeTuning
    include.release.openshift.io/hypershift: "true"
    include.release.openshift.io/ibm-cloud-managed: "true"
    include.release.openshift.io/self-managed-high-availability: "true"
    include.release.openshift.io/single-node-developer: "true"
  name: allow-egress-to-api-server
  namespace: openshift-cluster-node-tuning-operator
spec:
  egress:
  - ports:
    - port: 6443
      protocol: TCP
  podSelector:
    matchExpressions:
    - { key: name, operator: In, values: [cluster-node-tuning-operator, tuned] }
  policyTypes:
  - Egress

# Allow access to the metrics server from openshift-monitoring namespace.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  annotations:
    capability.openshift.io/name: NodeTuning
    include.release.openshift.io/hypershift: "true"
    include.release.openshift.io/ibm-cloud-managed: "true"
    include.release.openshift.io/self-managed-high-availability: "true"
    include.release.openshift.io/single-node-developer: "true"
  name: allow-metrics-traffic
  namespace: openshift-cluster-node-tuning-operator
spec:
  ingress:
  - from:
    # Only access from the openshift-monitoring namespace is needed.
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: openshift-monitoring
    ports:
    - port: 60000
      protocol: TCP
  podSelector:
    matchLabels:
      name: cluster-node-tuning-operator
  policyTypes:
  - Ingress

# Allow access to the webhook server from host-network pods, i.e. the
# kube-apiserver.  OpenShift SDN and OVN-Kubernetes classify all host-network
# traffic (from any node) as the "openshift-host-network" namespace; selecting
# it is the narrowest reliable match for the kube-apiserver, which has no
# identity of its own.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  annotations:
    capability.openshift.io/name: NodeTuning
    include.release.openshift.io/hypershift: "true"
    include.release.openshift.io/ibm-cloud-managed: "true"
    include.release.openshift.io/self-managed-high-availability: "true"
    include.release.openshift.io/single-node-developer: "true"
  name: allow-webhook-traffic
  namespace: openshift-cluster-node-tuning-operator
spec:
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          policy-group.network.openshift.io/host-network: ""
    ports:
    - port: 4343
      protocol: TCP
  podSelector:
    matchLabels:
      name: cluster-node-tuning-operator
  policyTypes:
  - Ingress
